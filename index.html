<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luz en la Oscuridad</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .parallax-wrapper {
            position: absolute;
            top: -4%;
            left: -4%;
            width: 108%;
            height: 108%;
            background-color: #050508;
            background-image: url('nostalgia.jpg');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            will-change: transform;
            transition: transform 0.15s ease-out;
        }

        .celestial-beam {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 110%;
            background: conic-gradient(from 180deg at 50% 0%, rgba(255, 230, 150, 0.3) 0deg, rgba(255, 255, 255, 0.08) 35deg, transparent 55deg, transparent 305deg, rgba(255, 255, 255, 0.08) 325deg, rgba(255, 230, 150, 0.3) 360deg);
            filter: blur(16px);
            pointer-events: none;
            animation: beamBreathe 6s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        @keyframes beamBreathe {
            0% { opacity: 0.5; transform: translateX(-50%) scaleX(0.9); }
            100% { opacity: 0.95; transform: translateX(-50%) scaleX(1.25); }
        }

        .ground-fog {
            position: absolute;
            bottom: -30px;
            left: -20%;
            width: 140%;
            height: 280px;
            background: radial-gradient(ellipse at bottom, rgba(220, 230, 255, 0.18) 0%, rgba(10, 15, 25, 0.7) 50%, rgba(0,0,0,0) 85%);
            animation: fogDrift 22s ease-in-out infinite alternate;
            filter: blur(25px);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        @keyframes fogDrift {
            0% { transform: translateX(-4%) translateY(0); opacity: 0.6; }
            100% { transform: translateX(4%) translateY(-10px); opacity: 0.9; }
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #textContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .floating-text-item {
            position: absolute;
            bottom: -30px;
            font-size: 13px;
            line-height: 1.4;
            letter-spacing: 0.04em;
            color: rgba(220, 225, 240, 0.85);
            font-style: italic;
            font-weight: 300;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 
                0 0 6px rgba(255, 255, 255, 0.6),
                0 2px 6px rgba(0, 0, 0, 0.95);
            will-change: transform, opacity;
            transition: color 0.4s ease, text-shadow 0.4s ease, transform 0.4s ease;
        }

        .floating-text-item.purified {
            color: #FFF2A3 !important;
            font-weight: 400;
            text-shadow: 
                0 0 12px rgba(254, 240, 138, 1),
                0 0 28px rgba(234, 179, 8, 0.85),
                0 2px 8px rgba(0, 0, 0, 1) !important;
            transform: scale(1.12);
        }

        @media (min-width: 640px) {
            .floating-text-item { font-size: 15px; }
        }

        @keyframes floatToSky {
            0% { transform: translateY(0) scale(0.95); opacity: 0; }
            10% { opacity: 0.95; transform: translateY(-10vh) scale(1); }
            85% { opacity: 0.85; }
            100% { transform: translateY(-104vh) scale(1.02); opacity: 0; }
        }

        .animate-float-up { animation: floatToSky 17s linear forwards; }

        .audio-start-prompt {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 40;
            box-shadow: 0 4px 16px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .fixed-dedication {
            position: absolute;
            bottom: 14px;
            right: 16px;
            font-size: 11px;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.85);
            font-style: italic;
            font-weight: 300;
            text-shadow: 0 1px 6px rgba(0,0,0,0.95);
            z-index: 30;
            pointer-events: none;
        }
    </style>
</head>
<body class="touch-none">

    <audio id="bgAudio" src="vidad.mp3" preload="auto" loop></audio>

    <div id="parallaxContainer" class="parallax-wrapper">
        <div class="celestial-beam"></div>
        <div class="ground-fog"></div>
        <canvas id="mainCanvas"></canvas>
        <div id="textContainer"></div>
    </div>

    <div id="audioPrompt" class="audio-start-prompt">
        ✨ Toca la pantalla para escuchar ✨
    </div>

    <div class="fixed-dedication">
        Un pequeño corazón en la oscuridad 🤍
    </div>

    <script>
        const SAD_CHILD_PHRASES = [
            "Tengo miedo de la oscuridad...",
            "Nadie quiere jugar conmigo hoy.",
            "¿Por qué todo se siente tan solo?",
            "Siento que nadie me escucha...",
            "A veces me escondo para llorar un ratito.",
            "Mis juguetes ya no me hacen sonreír.",
            "¿Cuándo va a parar la lluvia?",
            "Ojalá supiera cómo ser feliz todo el tiempo...",
            "Me siento muy pequeñito en este mundo tan grande.",
            "¿A dónde se van las sonrisas cuando se apagan?",
            "Siento un vacío frío aquí adentro...",
            "Le hablo a las sombras para no sentirme tan solo.",
            "A veces me siento un fantasma.",
            "¿Por qué duele tanto cuando nadie te mira?",
            "Nadie entiende lo que siento por dentro...",
            "Quisiera que alguien me diera un abrazo fuerte.",
            "Miro a las estrellas y les pido un deseo...",
            "A veces se me olvida cómo reír de verdad.",
            "El silencio en mi cuarto me da miedo.",
            "Solo quiero que todo esté bien algún día...",
            "Siento que estorbo en todas partes.",
            "¿Por qué es tan difícil encajar con los demás?",
            "Miro por la ventana esperando algo que no llega...",
            "Mis lágrimas son transparentes para que nadie las note.",
            "Ojalá pudiera desaparecer por un momento."
        ];

        let phraseQueue = [...SAD_CHILD_PHRASES];
        let canvas, ctx, textContainer, parallaxContainer, audioPrompt, bgAudio;
        let width, height;
        let stars = [], fireflies = [], shootingStars = [], butterflies = [], silhouettes = [], beamParticles = [];

        function playAudioTrack() {
            if (bgAudio) {
                bgAudio.play().then(() => {
                    if (audioPrompt) {
                        audioPrompt.style.opacity = '0';
                        setTimeout(() => audioPrompt.remove(), 1600);
                    }
                }).catch(() => {
                    if (audioPrompt) {
                        audioPrompt.textContent = "⚠️ No se encontró 'vidad_lara.mp3'";
                        audioPrompt.style.background = "rgba(180, 40, 40, 0.8)";
                    }
                });
            }
        }

        class Star {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.radius = Math.random() * 1.6 + 0.4;
                this.speedY = -(Math.random() * 0.2 + 0.05);
                this.baseAlpha = Math.random() * 0.6 + 0.3;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.03 + 0.01;
                this.twinkleAngle = Math.random() * Math.PI * 2;
            }
            update() {
                this.y += this.speedY;
                this.twinkleAngle += this.twinkleSpeed;
                this.alpha = this.baseAlpha + Math.sin(this.twinkleAngle) * 0.35;
                if (this.y < -10) this.reset(false);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0.1, Math.min(1, this.alpha));
                ctx.fillStyle = "#FFFFFF";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Firefly {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 50;
                this.radius = Math.random() * 2.2 + 0.8;
                this.vy = -(Math.random() * 0.8 + 0.3);
                this.vx = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.5 + 0.5;
                this.decay = Math.random() * 0.003 + 0.001;
                this.oscillation = Math.random() * Math.PI * 2;
            }
            update() {
                this.y += this.vy;
                this.oscillation += 0.03;
                this.x += this.vx + Math.sin(this.oscillation) * 0.5;
                this.alpha -= this.decay;
                if (this.alpha <= 0 || this.y < -20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = "#FFF9D2";
                ctx.shadowColor = "#FDE68A";
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class BeamSpark {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 80;
                this.y = y + (Math.random() - 0.5) * 15;
                this.radius = Math.random() * 2.5 + 1;
                this.vy = -(Math.random() * 1.8 + 0.6);
                this.vx = (Math.random() - 0.5) * 1.2;
                this.alpha = 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.025;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = "#FEF08A";
                ctx.shadowColor = "#EAB308";
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class LightButterfly {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 10 + 12;
                this.vx = (Math.random() - 0.5) * 2.8;
                this.vy = -(Math.random() * 2 + 1.2);
                this.wingAngle = 0;
                this.wingSpeed = Math.random() * 0.15 + 0.12;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.005;
            }
            update() {
                this.x += this.vx + Math.sin(this.y * 0.03) * 1.2;
                this.y += this.vy;
                this.wingAngle += this.wingSpeed;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = "#FFFFFF";
                ctx.shadowColor = "#FDE68A";
                ctx.shadowBlur = 12;

                const wingScaleX = Math.sin(this.wingAngle) * 0.8;
                ctx.beginPath();
                ctx.ellipse(-this.size * 0.4 * Math.abs(wingScaleX), -this.size * 0.2, this.size * 0.6 * Math.abs(wingScaleX), this.size * 0.4, -0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(this.size * 0.4 * Math.abs(wingScaleX), -this.size * 0.2, this.size * 0.6 * Math.abs(wingScaleX), this.size * 0.4, 0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /* SILUETA: Más veloz y con control de lado de origen */
        class ShadowSilhouette {
            constructor(forcedDirection = null) {
                // 1 = izquierda a derecha, -1 = derecha a izquierda
                this.direction = forcedDirection !== null ? forcedDirection : (Math.random() < 0.5 ? 1 : -1);
                this.x = this.direction === 1 ? -80 : width + 80;
                // Altura variable para que no se encima una con otra
                this.y = height - (75 + Math.random() * 45); 
                // Velocidad aumentada (de 0.3 a 1.2+ para que caminen fluido y rápido)
                this.speed = (Math.random() * 0.6 + 1.1) * this.direction; 
                this.scale = Math.random() * 0.25 + 0.9;
                this.pulse = Math.random() * Math.PI;
                this.active = true;
            }
            update() {
                if (!this.active) return;
                this.x += this.speed;
                this.pulse += 0.08;

                if ((this.direction === 1 && this.x > width + 120) || 
                    (this.direction === -1 && this.x < -120)) {
                    this.active = false;
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale((this.direction === -1 ? -1 : 1) * this.scale, this.scale);

                ctx.shadowColor = "rgba(255, 255, 255, 0.85)";
                ctx.shadowBlur = 18;
                ctx.fillStyle = "#0A0D14";

                // Cabeza
                ctx.beginPath();
                ctx.arc(0, -45, 10, 0, Math.PI * 2);
                ctx.fill();

                // Cuerpo
                ctx.beginPath();
                ctx.moveTo(-7, -35);
                ctx.lineTo(7, -35);
                ctx.lineTo(10, 0);
                ctx.lineTo(-10, 0);
                ctx.closePath();
                ctx.fill();

                // Hilo del Globo
                ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(5, -25);
                ctx.quadraticCurveTo(15, -50, 8, -70);
                ctx.stroke();

                // Globo de Luz
                const glowSize = 10 + Math.sin(this.pulse) * 2;
                ctx.fillStyle = "#FFF9C4";
                ctx.shadowColor = "#FACC15";
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(8, -75, glowSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
            checkHit(px, py) {
                if (!this.active) return false;
                return Math.hypot(this.x - px, this.y - py) < 80;
            }
            disintegrate() {
                this.active = false;
                for (let i = 0; i < 8; i++) {
                    butterflies.push(new LightButterfly(this.x + (Math.random() - 0.5) * 40, this.y - 40));
                }
                for (let i = 0; i < 15; i++) {
                    let f = new Firefly();
                    f.x = this.x + (Math.random() - 0.5) * 50;
                    f.y = this.y - 30;
                    f.vy = -(Math.random() * 2 + 1);
                    f.alpha = 1;
                    fireflies.push(f);
                }
            }
        }

        function initScene() {
            stars = [];
            fireflies = [];
            silhouettes = [];
            const starCount = Math.min(Math.floor((width * height) / 3200), 220);
            for (let i = 0; i < starCount; i++) stars.push(new Star());
            for (let i = 0; i < 35; i++) fireflies.push(new Firefly());

            // APARECEN DE INMEDIATO 2 DE CADA LADO AL CARGAR
            silhouettes.push(new ShadowSilhouette(1));  // Izquierda 1
            silhouettes.push(new ShadowSilhouette(1));  // Izquierda 2
            silhouettes.push(new ShadowSilhouette(-1)); // Derecha 1
            silhouettes.push(new ShadowSilhouette(-1)); // Derecha 2
        }

        /* CICLO DE APARICIÓN: Frecuente y continuo para mantener ambos lados activos */
        function spawnSilhouetteLoop() {
            // Permite hasta 6 u 8 siluetas simultáneas en pantalla
            if (silhouettes.length < 6) {
                if (Math.random() < 0.7) silhouettes.push(new ShadowSilhouette(1));  // Desde la izquierda
                if (Math.random() < 0.7) silhouettes.push(new ShadowSilhouette(-1)); // Desde la derecha
            }
            // Revisa cada 1.5 a 2.5 segundos (mucho más rápido)
            setTimeout(spawnSilhouetteLoop, Math.random() * 1000 + 1500);
        }

        function getNextPhrase() {
            if (phraseQueue.length === 0) phraseQueue = [...SAD_CHILD_PHRASES].sort(() => Math.random() - 0.5);
            return phraseQueue.pop();
        }

        function spawnFloatingText(customX = null) {
            const textEl = document.createElement('div');
            textEl.className = 'floating-text-item animate-float-up';
            textEl.textContent = `"${getNextPhrase()}"`;

            const padding = 15;
            const screenWidth = window.innerWidth;
            let randomX = customX !== null 
                ? Math.max(padding, Math.min(screenWidth - 200, customX - 80))
                : Math.random() * (screenWidth - 220) + padding;

            textEl.style.left = `${randomX}px`;
            const duration = Math.random() * 4 + 15;
            textEl.style.animationDuration = `${duration}s`;

            textContainer.appendChild(textEl);
            setTimeout(() => {
                if (textEl && textEl.parentNode) textEl.parentNode.removeChild(textEl);
            }, duration * 1000 + 100);
        }

        function processBeamPurification() {
            const beamCenter = width / 2;
            const beamRadius = 160;
            const items = document.querySelectorAll('.floating-text-item');

            items.forEach(el => {
                const rect = el.getBoundingClientRect();
                const textCenterX = rect.left + rect.width / 2;
                const textY = rect.top + rect.height / 2;
                const distance = Math.abs(textCenterX - beamCenter);

                if (distance < beamRadius) {
                    el.classList.add('purified');
                    if (Math.random() < 0.35) {
                        beamParticles.push(new BeamSpark(textCenterX, textY));
                    }
                } else {
                    el.classList.remove('purified');
                }
            });
        }

        function startAutomaticTextStream() {
            spawnFloatingText();
            setTimeout(() => spawnFloatingText(), 1500);

            function scheduleNext() {
                setTimeout(() => {
                    spawnFloatingText();
                    scheduleNext();
                }, Math.random() * 1800 + 2200);
            }
            scheduleNext();
        }

        function handleInteraction(clientX, clientY) {
            playAudioTrack();

            let hitSilhouette = false;
            for (let sil of silhouettes) {
                if (sil.checkHit(clientX, clientY)) {
                    sil.disintegrate();
                    hitSilhouette = true;
                }
            }

            if (!hitSilhouette) {
                for (let i = 0; i < 4; i++) {
                    butterflies.push(new LightButterfly(clientX + (Math.random() - 0.5) * 30, clientY + (Math.random() - 0.5) * 20));
                }
                spawnFloatingText(clientX);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let star of stars) { star.update(); star.draw(); }
            for (let firefly of fireflies) { firefly.update(); firefly.draw(); }

            for (let i = silhouettes.length - 1; i >= 0; i--) {
                silhouettes[i].update();
                silhouettes[i].draw();
                if (!silhouettes[i].active) silhouettes.splice(i, 1);
            }

            for (let i = beamParticles.length - 1; i >= 0; i--) {
                beamParticles[i].update();
                beamParticles[i].draw();
                if (beamParticles[i].alpha <= 0) beamParticles.splice(i, 1);
            }

            for (let i = butterflies.length - 1; i >= 0; i--) {
                butterflies[i].update();
                butterflies[i].draw();
                if (butterflies[i].alpha <= 0) butterflies.splice(i, 1);
            }

            processBeamPurification();

            requestAnimationFrame(animate);
        }

        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('mainCanvas');
            ctx = canvas.getContext('2d');
            textContainer = document.getElementById('textContainer');
            parallaxContainer = document.getElementById('parallaxContainer');
            audioPrompt = document.getElementById('audioPrompt');
            bgAudio = document.getElementById('bgAudio');

            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            initScene();
            animate();
            spawnSilhouetteLoop();
            startAutomaticTextStream();

            window.addEventListener('click', (e) => handleInteraction(e.clientX, e.clientY));
            window.addEventListener('touchstart', (e) => {
                if (e.touches && e.touches[0]) {
                    handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
                }
            });

            let targetTiltX = 0, targetTiltY = 0, currentTiltX = 0, currentTiltY = 0;
            window.addEventListener('mousemove', (e) => {
                targetTiltX = (e.clientX - width / 2) / (width / 2) * 5;
                targetTiltY = (e.clientY - height / 2) / (height / 2) * -5;
            });

            function updateParallax() {
                currentTiltX += (targetTiltX - currentTiltX) * 0.05;
                currentTiltY += (targetTiltY - currentTiltY) * 0.05;
                if (parallaxContainer) {
                    parallaxContainer.style.transform = `perspective(1000px) rotateY(${currentTiltX}deg) rotateX(${currentTiltY}deg) scale(1.03)`;
                }
                requestAnimationFrame(updateParallax);
            }
            updateParallax();

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initScene();
            });
        });
    </script>
</body>
</html>
